name: Build and release userscript

on:
  push:
    branches: [master]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bump userscript version
        id: version
        run: |
          VERSION=$(grep -oP "version: '\K[^']+" vite.config.ts)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW="$MAJOR.$MINOR.$((PATCH+1))"
          sed -i "s/version: '$VERSION'/version: '$NEW'/" vite.config.ts
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump to v${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "$TAG" dist/tricipital-redesign.user.js --title "$TAG" --generate-notes
